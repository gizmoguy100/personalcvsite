{{- $name := .name | default "cv" -}}
{{- $size := .size | default 16 -}}
{{- $vb := "0 0 16 16" -}}
{{- if eq $name "github" -}}{{- $vb = "0 0 24 24" -}}{{- end -}}
<svg class="icon icon-{{ $name }}" width="{{ $size }}" height="{{ $size }}" viewBox="{{ $vb }}" aria-hidden="true" focusable="false">
  {{- if eq $name "computer" -}}
  <rect x="1.5" y="2" width="13" height="9" rx="1" fill="#ece9d8" stroke="#4f6536"/>
  <rect x="3" y="3.5" width="10" height="6" fill="#7d9060"/>
  <rect x="3.5" y="4" width="4" height="3" fill="#a9be88" opacity=".55"/>
  <rect x="5.5" y="11" width="5" height="1.5" fill="#b9b4a1"/>
  <rect x="3" y="12.5" width="10" height="1.5" rx=".5" fill="#ece9d8" stroke="#6b7a55" stroke-width=".8"/>
  {{- else if eq $name "cv" -}}
  <path d="M3 1.5h6l4 4v9H3z" fill="#fff" stroke="#6b7a55"/>
  <path d="M9 1.5v4h4" fill="#e2dfcd" stroke="#6b7a55"/>
  <g stroke="#8a8573" stroke-width="1">
    <path d="M5 7.5h6M5 9.5h6M5 11.5h4"/>
  </g>
  {{- else if eq $name "about" -}}
  <circle cx="8" cy="5.2" r="3" fill="#dcc9a0" stroke="#6b5a34"/>
  <path d="M2.5 14.2c0-3 2.5-4.6 5.5-4.6s5.5 1.6 5.5 4.6" fill="#7d9060" stroke="#4f6536"/>
  <path d="M8 9.8v4.4" stroke="#4f6536" stroke-width="1"/>
  {{- else if eq $name "contact" -}}
  <rect x="1.5" y="4" width="13" height="9" rx="1" fill="#fdfcf5" stroke="#6b7a55"/>
  <path d="M2 5l6 4.5L14 5" fill="none" stroke="#6b7a55"/>
  <path d="M2.2 12l3.9-3.4M13.8 12l-3.9-3.4" stroke="#c9c4b1"/>
  {{- else if eq $name "camera" -}}
  <rect x="1.5" y="4.5" width="13" height="9" rx="1.5" fill="#ece9d8" stroke="#4f6536"/>
  <path d="M5 4.5l1-2h4l1 2" fill="#c9c4b1" stroke="#4f6536" stroke-linejoin="round"/>
  <circle cx="8" cy="9" r="3" fill="#7d9060" stroke="#4f6536"/>
  <circle cx="8" cy="9" r="1.3" fill="#dfe8cf"/>
  <circle cx="12.6" cy="6.3" r=".7" fill="#f0be5a"/>
  {{- else if eq $name "folder" -}}
  <path d="M1.5 4h4l1.5 1.5h7.5v8H1.5z" fill="#e7c977" stroke="#8a7434"/>
  <path d="M1.5 6.2h13" stroke="#c9a94f"/>
  {{- else if eq $name "warning" -}}
  <path d="M8 1.5l7 13H1z" fill="#f3d065" stroke="#8a7434" stroke-linejoin="round"/>
  <path d="M8 5.5v5" stroke="#3b2f10" stroke-width="1.4"/>
  <circle cx="8" cy="12.4" r=".9" fill="#3b2f10"/>
  {{- else if eq $name "github" -}}
  <path fill="currentColor" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
  {{- else -}}
  <rect x="2" y="2" width="12" height="12" rx="1" fill="#ece9d8" stroke="#6b7a55"/>
  {{- end -}}
</svg>
