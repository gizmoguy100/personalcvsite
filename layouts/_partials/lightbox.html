<dialog class="lightbox" id="lightbox" aria-label="Photo viewer">
  <div class="lightbox-inner">
    <button class="lightbox-close" type="button" aria-label="Close photo viewer">&times;</button>
    <img class="lightbox-img" alt="">
    <p class="lightbox-caption" id="lightbox-caption" hidden></p>
  </div>
</dialog>
{{- $js := resources.Get "js/lightbox.js" | minify | fingerprint -}}
<script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
