{{- $img := resources.Get "img/headshot.jpg" -}}
{{- $small := $img.Resize "200x webp q82" -}}
{{- $large := $img.Resize "400x webp q82" -}}
<figure class="photo">
  <picture>
    <source type="image/webp" srcset="{{ $small.RelPermalink }} 200w, {{ $large.RelPermalink }} 400w" sizes="(max-width: 760px) 200px, 176px">
    <img src="{{ $img.RelPermalink }}" width="{{ $img.Width }}" height="{{ $img.Height }}" alt="Alex Ferriroli"{{ if .priority }} loading="eager" fetchpriority="high"{{ else }} loading="lazy" decoding="async"{{ end }}>
  </picture>
  <figcaption>Alex Ferriroli</figcaption>
</figure>
