<!doctype html>
<html lang="{{ site.Language.Locale | default "en-GB" }}">
{{ partial "head.html" . }}
<body class="kind-{{ .Kind }}">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="shell">
    <div class="window">
      {{ partial "titlebar.html" . }}
      {{ partial "breadcrumb.html" . }}
      <div class="window-body">
        {{ partial "taskpane.html" . }}
        <main id="main" class="content" tabindex="-1">
          {{ block "main" . }}{{ end }}
        </main>
      </div>
      {{ partial "statusbar.html" . }}
    </div>
  </div>
</body>
</html>
